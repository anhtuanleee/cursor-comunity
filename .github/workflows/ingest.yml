name: Ingest creative sources

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source to run"
        required: true
        default: recent
        type: choice
        options:
          - recent
          - creative

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_CRON_SECRET: ${{ secrets.INGEST_CRON_SECRET }}
          SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || github.event.schedule == '2,17,32,47 * * * *' && 'recent' || 'creative' }}
        run: |
          test -n "$INGEST_URL"
          test -n "$INGEST_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --header "Authorization: Bearer $INGEST_CRON_SECRET" \
            "$INGEST_URL/api/internal/ingest?source=$SOURCE"
